# Corre las pruebas automáticas en cada PR y en cada cambio de la rama que se
# publica. Usa una base de datos de prueba vacía que se crea y se descarta en
# cada corrida: nunca toca la base real.
name: Pruebas

on:
  pull_request:
  push:
    branches: [jules-6093302734952481744-2671a759]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pruebas
          POSTGRES_PASSWORD: pruebas
          POSTGRES_DB: muni_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pruebas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://pruebas:pruebas@localhost:5432/muni_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Revisión de tipos
        run: npx tsc --noEmit
      - name: Pruebas rápidas (permisos y cálculos)
        run: npm test
      - name: Pruebas con base de datos (fichas, entregas, stock, usuarios)
        run: npm run test:db
